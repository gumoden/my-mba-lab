<!DOCTYPE html>
<html>
<head>
    <title>Calculadora BMI</title>
    <link rel="stylesheet" href="bmi.css" />
</head>
<body>
    <div class="card">
        <h2>Calculadora BMI</h2>

        <div class="field">
            <label>Peso (kg)</label>
            <input id="weight" type="number" placeholder="ex: 70" />
        </div>

        <div class="field">
            <label>Altura (m)</label>
            <input id="height" type="number" placeholder="ex: 1.75" />
        </div>

        <button onclick="calculate()">Calcular</button>

        <p id="result"></p>
    </div>

    <script src="bmi.js"></script>
</body>
</html>
